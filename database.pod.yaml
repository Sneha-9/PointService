apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pointservice-db
  namespace: psn
spec:
  serviceName: "pointservice-db-h"
  replicas: 1
  selector:
    matchLabels:
      app: pointservice-db
  template:
    metadata:
      labels:
        app: pointservice-db
    spec:
      containers:
        - name: pointservice-db
          image: postgres:alpine
          volumeMounts:
            - name: postgres-storage-pv-ps      # Must match the name in 'volumes'
              mountPath: /var/lib/postgresql/18/docker # The internal Postgres path
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage-pv-ps
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path